name: Build mp3sync image

on:
  push:
    branches: [main]
    paths:
      - server/mp3sync/**
      - .github/workflows/mp3sync-image.yml
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR names must be lowercase; GitHub user names need not be. The image
      # is named after the stack, not the repo: ghcr.io/<owner>/mp3sync.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mp3sync" >> "$GITHUB_ENV"

      # amd64 only. Add linux/arm64 here if your server is a Pi or similar.
      - uses: docker/build-push-action@v6
        with:
          context: server/mp3sync
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
